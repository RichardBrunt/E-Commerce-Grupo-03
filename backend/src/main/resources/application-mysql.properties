# MySQL profile
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/ecommerce_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Con Hibernate 6 (Spring Boot 3), se puede omitir el dialecto para autodetección.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hikari pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000


